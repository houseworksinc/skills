name: Supply-chain policy

on:
  pull_request:
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '**/yarn.lock'
      - '**/pnpm-lock.yaml'
      - '**/pyproject.toml'
      - '**/uv.lock'
      - '**/poetry.lock'
      - '**/requirements*.txt'
      - '**/go.mod'
      - '**/go.sum'
      - '**/Cargo.lock'
      - '**/pom.xml'
      - '**/gradle.lockfile'
      - '**/Dockerfile*'
      - '**/.terraform.lock.hcl'
      - '.github/sbom/**'
      - '.github/scripts/*sbom*'
      - '.github/workflows/sbom.yml'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: false

jobs:
  supply-chain-policy:
    name: supply-chain-policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # Actions are pinned to commit SHAs rather than mutable major tags; this template is copied
      # into product repositories (recon targets), so SHAs are the stricter and more consistent
      # choice. Bump by updating the SHA and the trailing comment in lockstep.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify repository configuration
        id: config
        run: |
          set -euo pipefail
          test -f .github/sbom/config.yml
          test -x .github/scripts/generate-sbom.sh
          enforcement="$(awk -F ': *' '/^enforcement:/{print $2; exit}' .github/sbom/config.yml)"
          case "$enforcement" in report|required) ;; *) echo "Invalid enforcement: $enforcement" >&2; exit 1 ;; esac
          echo "enforcement=$enforcement" >> "$GITHUB_OUTPUT"

      # The repository script builds/selects the appropriate immutable target and emits
      # sbom.cdx.json. See generator-contract.md in houseworksinc/skills.
      - name: Generate CycloneDX SBOM
        run: .github/scripts/generate-sbom.sh

      - name: Validate CycloneDX against the pinned offline schema
        run: |
          python3 -m venv "$RUNNER_TEMP/sbom-validator"
          "$RUNNER_TEMP/sbom-validator/bin/pip" install 'jsonschema[format]==4.25.1'
          "$RUNNER_TEMP/sbom-validator/bin/python" .github/scripts/validate-sbom.py sbom.cdx.json .github/sbom/schema

      - name: Validate BOM and make evidence manifest
        id: evidence
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          set -euo pipefail
          export VERSION="$RELEASE_VERSION"
          export ARTIFACT_DIGEST="$(cat .github/sbom/artifact-digest)"
          python3 .github/scripts/prepare-sbom-evidence.py
          "$RUNNER_TEMP/sbom-validator/bin/python" .github/scripts/validate-sbom.py sbom.cdx.json .github/sbom/schema
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Scan candidate SBOM with OSV
        id: osv
        continue-on-error: true
        run: |
          scanner_user="$(id -u):$(id -g)"
          case "$(docker info --format '{{json .SecurityOptions}}')" in *rootless*) scanner_user=0:0 ;; esac
          docker run --rm --user "$scanner_user" -v "$PWD:/workspace" -w /workspace \
            ghcr.io/google/osv-scanner@sha256:bf249317dcf838cf9e47f370cfd4dd4178d875bba14e3ce74d299c5bf1b129a1 \
            scan source --sbom=sbom.cdx.json --format=json --output=osv-findings.json

      - name: Preserve scan execution result
        env:
          SCAN_OUTCOME: ${{ steps.osv.outcome }}
        run: |
          if [ ! -f osv-findings.json ]; then
            jq -n --arg scan_outcome "$SCAN_OUTCOME" \
              '{schema:"houseworks-sbom-scan-result/v1", scanner:"osv-scanner", outcome:$scan_outcome}' \
              > osv-findings.json
          fi
          jq --arg outcome "$SCAN_OUTCOME" '.scan_outcome=$outcome' metadata.json > metadata.tmp
          mv metadata.tmp metadata.json

      - name: Upload candidate evidence
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sbom.cdx.json
            sbom.cdx.json.sha256
            metadata.json
            osv-findings.json
          retention-days: 14
          if-no-files-found: error

      - name: Enforce vulnerability policy
        if: steps.config.outputs.enforcement == 'required' && steps.osv.outcome != 'success'
        run: |
          echo "::error::OSV scan found a blocking issue or could not complete. Resolve it or use an approved, expiring exception."
          exit 1

  publish-release:
    name: Publish release evidence
    needs: supply-chain-policy
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download the evidence generated by this run
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_NAME: sbom-${{ github.run_id }}-${{ github.run_attempt }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$EVIDENCE_NAME"

      - name: Configure AWS credentials for release evidence
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.SBOM_AWS_ROLE_ARN }}
          aws-region: ${{ vars.SBOM_AWS_REGION }}

      - name: Publish immutable release evidence to S3
        env:
          BUCKET: ${{ vars.SBOM_S3_BUCKET }}
          PREFIX: ${{ vars.SBOM_S3_PREFIX }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$BUCKET"
          bash .github/scripts/publish-sbom-evidence.sh

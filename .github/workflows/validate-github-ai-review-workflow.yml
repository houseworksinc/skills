name: Validate AI Review Workflow Source

on:
  pull_request:
    paths:
      - "github-ai-review-workflow/**"
      - "actionlint.yaml"
      - ".github/workflows/validate-github-ai-review-workflow.yml"
  push:
    branches: [main]
    paths:
      - "github-ai-review-workflow/**"
      - "actionlint.yaml"
      - ".github/workflows/validate-github-ai-review-workflow.yml"

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate canonical workflow YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
        with:
          args: github-ai-review-workflow/references/workflow.yml

# SOURCE OF TRUTH: houseworksinc/skills/github-ai-review-workflow
# Sync this workflow from the source repository. Do not make local workflow changes;
# repositories may add only custom reviewer-skill configuration in .github/ai-review/config.yml.
name: AI Review

on:
  issue_comment:
    types: [created]

concurrency:
  group: ai-review-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  ai-review-control-plane:
    name: AI review control plane
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/ai-review')
    runs-on: [self-hosted, mumbai-office]
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Resolve PR state and apply control-plane actions
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.payload.issue.number;
            const comment = context.payload.comment;
            const username = comment.user.login;
            const commentBody = comment.body.trim();
            const commandMatch = commentBody.match(
              /^\/ai-review(?:\s+(claude|codex))?\s*$/i
            );

            if (!commandMatch) {
              core.setFailed(
                "Invalid command. Use /ai-review, /ai-review claude, or /ai-review codex."
              );
              return;
            }

            const provider =
              (commandMatch[1] || "claude").toLowerCase() === "codex"
                ? "codex"
                : "claude";

            const skipReview = async (reason) => {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: [
                  "AI review not started.",
                  "",
                  `Reason: ${reason}`,
                  "",
                  "Start a new review when the pull request is open, ready for review, and uses a branch in this repository.",
                ].join("\n"),
              });
              core.setOutput("eligible", "no");
              core.setOutput("skip_reason", reason);
              core.notice(`AI review skipped: ${reason}`);
            };

            let permissionLevel;
            try {
              const { data: permissionData } =
                await github.rest.repos.getCollaboratorPermissionLevel({
                  owner,
                  repo,
                  username,
                });
              permissionLevel = permissionData.permission;
            } catch (error) {
              if (error.status === 404) {
                core.setFailed(
                  `Commenter @${username} does not have repository access.`
                );
                return;
              }
              throw error;
            }

            const allowedPermissions = new Set(["write", "maintain", "admin"]);
            if (!allowedPermissions.has(permissionLevel)) {
              core.setFailed(
                `Commenter @${username} has permission level ${permissionLevel}, which is not allowed to invoke /ai-review.`
              );
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: issueNumber,
            });

            if (pr.state !== "open") {
              await skipReview(`PR #${issueNumber} is not open.`);
              return;
            }

            if (pr.draft) {
              await skipReview(`PR #${issueNumber} is a draft.`);
              return;
            }

            const headRepoFullName = pr.head.repo?.full_name || "";
            if (headRepoFullName !== `${owner}/${repo}`) {
              await skipReview(
                `PR #${issueNumber} is from a fork (${headRepoFullName}); AI review of fork PRs is disabled.`
              );
              return;
            }

            const labelName = "ai-review";
            let labelAdded = false;

            try {
              await github.rest.issues.getLabel({
                owner,
                repo,
                name: labelName,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.issues.createLabel({
                owner,
                repo,
                name: labelName,
                color: "1d76db",
                description: "PR has been enrolled in AI review.",
              });
            }

            const currentLabels = new Set(
              (pr.labels || []).map((label) => label.name)
            );
            if (!currentLabels.has(labelName)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: [labelName],
              });
              labelAdded = true;
            }

            core.setOutput("permission_level", permissionLevel);
            core.setOutput("eligible", "yes");
            core.setOutput("provider", provider);
            core.setOutput("label_added", labelAdded ? "yes" : "no");
            core.setOutput("pr_number", issueNumber.toString());
            core.setOutput("commenter", username);
            core.setOutput("pr_title", pr.title);
            core.setOutput("pr_author", pr.user?.login || "");
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("head_ref", pr.head.ref);
            core.setOutput(
              "head_repo",
              pr.head.repo?.full_name || `${owner}/${repo}`
            );
            core.setOutput("base_sha", pr.base.sha);
            core.setOutput("base_ref", pr.base.ref);
            core.setOutput(
              "base_repo",
              pr.base.repo?.full_name || `${owner}/${repo}`
            );
            core.setOutput("additions", pr.additions.toString());
            core.setOutput("deletions", pr.deletions.toString());
            core.setOutput("changed_files", pr.changed_files.toString());
            const changedFiles = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner,
                repo,
                pull_number: issueNumber,
                per_page: 100,
              }
            );
            core.setOutput(
              "changed_files_list",
              (changedFiles || []).map((file) => file.filename).join("\n")
            );
            core.setOutput(
              "risk_mode",
              pr.changed_files > 60 ? "risk-summary" : "line-review"
            );

      - name: Checkout PR head
        if: steps.resolve.outputs.eligible == 'yes'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ steps.resolve.outputs.head_repo }}
          ref: ${{ steps.resolve.outputs.head_sha }}
          fetch-depth: 0

      - name: Prepare AI review scratch directory
        if: steps.resolve.outputs.eligible == 'yes'
        env:
          AI_REVIEW_SCRATCH_DIR: ${{ runner.temp }}/ai-review-work-${{ github.run_id }}
        run: |
          if [[ "${AI_REVIEW_SCRATCH_DIR}" != "${RUNNER_TEMP}"/ai-review-work-* ]]; then
            echo "Refusing unsafe AI review scratch path: ${AI_REVIEW_SCRATCH_DIR}" >&2
            exit 1
          fi
          if [[ -e "${AI_REVIEW_SCRATCH_DIR}" && ! -O "${AI_REVIEW_SCRATCH_DIR}" ]]; then
            echo "AI review scratch path is not owned by the runner user: ${AI_REVIEW_SCRATCH_DIR}" >&2
            exit 1
          fi
          rm -rf -- "${AI_REVIEW_SCRATCH_DIR}"
          mkdir -p "${AI_REVIEW_SCRATCH_DIR}"
          chmod 700 "${AI_REVIEW_SCRATCH_DIR}"

      - name: Set up Node.js
        if: steps.resolve.outputs.eligible == 'yes'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.x"
          # No npm/yarn cache here: this workflow never runs npm/yarn install,
          # so there is nothing for that cache to speed up. The relevant cache
          # is setup-node's own tool-cache, which self-hosted runners persist
          # across jobs automatically — the Node download only happens once
          # per runner host, not once per /ai-review invocation.

      - name: Validate local AI review runner
        if: steps.resolve.outputs.eligible == 'yes'
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "node is required to execute .github/scripts/ai-review-run.mjs" >&2
            exit 1
          fi

      - name: Load repo AI review overrides
        id: load_repo_ai_review_config
        if: steps.resolve.outputs.eligible == 'yes'
        run: |
          ruby <<'RUBY'
          require "json"
          require "yaml"

          config_path = ".github/ai-review/config.yml"
          config = {}

          if File.exist?(config_path)
            loaded = YAML.safe_load(
              File.read(config_path),
              permitted_classes: [],
              permitted_symbols: [],
              aliases: true
            )
            config = loaded.is_a?(Hash) ? loaded : {}
          end

          string_list = lambda do |value|
            Array(value).flatten.compact.map(&:to_s).reject(&:empty?)
          end

          normalized = {
            reviewer_notes: config["reviewer_notes"].to_s,
            instruction_files: string_list.call(config["instruction_files"]),
            ignored_paths: string_list.call(config["ignored_paths"]),
            high_priority_paths: string_list.call(config["high_priority_paths"]),
            review_mode: config["review_mode"].to_s,
            inline_comment_limit: config["inline_comment_limit"],
            summary_findings_limit: config["summary_findings_limit"],
            prompt_fragments: string_list.call(config["prompt_fragments"]),
          }

          prompt_context_lines = []
          prompt_context_lines << "Repo reviewer notes:" if normalized[:reviewer_notes] != ""
          prompt_context_lines << normalized[:reviewer_notes] if normalized[:reviewer_notes] != ""
          prompt_context_lines << "" unless prompt_context_lines.empty?
          prompt_context_lines << "Repository instruction files: #{normalized[:instruction_files].join(', ')}" if normalized[:instruction_files].any?
          prompt_context_lines << "Ignored paths: #{normalized[:ignored_paths].join(', ')}" if normalized[:ignored_paths].any?
          prompt_context_lines << "High priority paths: #{normalized[:high_priority_paths].join(', ')}" if normalized[:high_priority_paths].any?
          prompt_context_lines << "" if normalized[:prompt_fragments].any? && !prompt_context_lines.empty?
          if normalized[:prompt_fragments].any?
            prompt_context_lines << "Repo prompt fragments:"
            normalized[:prompt_fragments].each_with_index do |fragment, index|
              prompt_context_lines << "#{index + 1}. #{fragment}"
            end
          end
          prompt_context = prompt_context_lines.join("\n").strip

          File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |file|
            config_present = File.exist?(config_path) ? "yes" : "no"
            file.puts "repo_config_present=#{config_present}"
            file.puts "repo_config_json<<EOF"
            file.puts JSON.generate(normalized)
            file.puts "EOF"
            file.puts "repo_reviewer_notes<<EOF"
            file.puts normalized[:reviewer_notes]
            file.puts "EOF"
            file.puts "repo_instruction_files_json<<EOF"
            file.puts JSON.generate(normalized[:instruction_files])
            file.puts "EOF"
            file.puts "repo_ignored_paths_json<<EOF"
            file.puts JSON.generate(normalized[:ignored_paths])
            file.puts "EOF"
            file.puts "repo_high_priority_paths_json<<EOF"
            file.puts JSON.generate(normalized[:high_priority_paths])
            file.puts "EOF"
            file.puts "repo_prompt_fragments_json<<EOF"
            file.puts JSON.generate(normalized[:prompt_fragments])
            file.puts "EOF"
            file.puts "repo_prompt_context<<EOF"
            file.puts prompt_context
            file.puts "EOF"
            file.puts "repo_review_mode=#{normalized[:review_mode]}"
            file.puts "repo_inline_comment_limit=#{normalized[:inline_comment_limit]}"
            file.puts "repo_summary_findings_limit=#{normalized[:summary_findings_limit]}"
          end
          RUBY

      - name: Run local AI review
        id: stub
        if: steps.resolve.outputs.eligible == 'yes'
        timeout-minutes: 20
        env:
          PROVIDER: ${{ steps.resolve.outputs.provider }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          AI_REVIEW_CLAUDE_MODEL: ${{ vars.AI_REVIEW_CLAUDE_MODEL }}
          AI_REVIEW_CODEX_MODEL: ${{ vars.AI_REVIEW_CODEX_MODEL }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          PR_TITLE: ${{ steps.resolve.outputs.pr_title }}
          ADDITIONS: ${{ steps.resolve.outputs.additions }}
          DELETIONS: ${{ steps.resolve.outputs.deletions }}
          CHANGED_FILES: ${{ steps.resolve.outputs.changed_files }}
          CHANGED_FILES_LIST: ${{ steps.resolve.outputs.changed_files_list }}
          RISK_MODE: ${{ steps.resolve.outputs.risk_mode }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          HEAD_REF: ${{ steps.resolve.outputs.head_ref }}
          HEAD_REPO: ${{ steps.resolve.outputs.head_repo }}
          BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
          BASE_REF: ${{ steps.resolve.outputs.base_ref }}
          BASE_REPO: ${{ steps.resolve.outputs.base_repo }}
          PR_AUTHOR: ${{ steps.resolve.outputs.pr_author }}
          COMMENTER: ${{ steps.resolve.outputs.commenter }}
          REVIEW_WORKSPACE: ${{ github.workspace }}
          AI_REVIEW_SCRATCH_DIR: ${{ runner.temp }}/ai-review-work-${{ github.run_id }}
          AI_REVIEW_ARTIFACT_DIR: ${{ runner.temp }}/ai-review-${{ github.run_id }}
          AI_REVIEW_REPO_CONFIG_JSON: ${{ steps.load_repo_ai_review_config.outputs.repo_config_json }}
          AI_REVIEW_REPO_REVIEWER_NOTES: ${{ steps.load_repo_ai_review_config.outputs.repo_reviewer_notes }}
          AI_REVIEW_REPO_INSTRUCTION_FILES_JSON: ${{ steps.load_repo_ai_review_config.outputs.repo_instruction_files_json }}
          AI_REVIEW_REPO_IGNORED_PATHS_JSON: ${{ steps.load_repo_ai_review_config.outputs.repo_ignored_paths_json }}
          AI_REVIEW_REPO_HIGH_PRIORITY_PATHS_JSON: ${{ steps.load_repo_ai_review_config.outputs.repo_high_priority_paths_json }}
          AI_REVIEW_REPO_PROMPT_FRAGMENTS_JSON: ${{ steps.load_repo_ai_review_config.outputs.repo_prompt_fragments_json }}
          AI_REVIEW_REPO_PROMPT_CONTEXT: ${{ steps.load_repo_ai_review_config.outputs.repo_prompt_context }}
          AI_REVIEW_REPO_REVIEW_MODE: ${{ steps.load_repo_ai_review_config.outputs.repo_review_mode }}
          AI_REVIEW_REPO_INLINE_COMMENT_LIMIT: ${{ steps.load_repo_ai_review_config.outputs.repo_inline_comment_limit }}
          AI_REVIEW_REPO_SUMMARY_FINDINGS_LIMIT: ${{ steps.load_repo_ai_review_config.outputs.repo_summary_findings_limit }}
        run: |
          node .github/scripts/ai-review-run.mjs >> "$GITHUB_OUTPUT"

      - name: Post AI review comment
        if: steps.resolve.outputs.eligible == 'yes'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          PR_TITLE: ${{ steps.resolve.outputs.pr_title }}
          PR_AUTHOR: ${{ steps.resolve.outputs.pr_author }}
          COMMENTER: ${{ steps.resolve.outputs.commenter }}
          ADDITIONS: ${{ steps.resolve.outputs.additions }}
          DELETIONS: ${{ steps.resolve.outputs.deletions }}
          CHANGED_FILES: ${{ steps.resolve.outputs.changed_files }}
          PR_CLASSIFICATION: ${{ steps.stub.outputs.pr_classification }}
          PROVIDER: ${{ steps.stub.outputs.provider }}
          REVIEW_MODEL_REPORTED: ${{ steps.stub.outputs.review_model_reported }}
          REVIEW_MODEL_SOURCE: ${{ steps.stub.outputs.review_model_source }}
          REVIEW_INPUT_TOKENS: ${{ steps.stub.outputs.review_input_tokens }}
          REVIEW_OUTPUT_TOKENS: ${{ steps.stub.outputs.review_output_tokens }}
          REVIEW_COST_USD: ${{ steps.stub.outputs.review_cost_usd }}
          REVIEW_USAGE_SOURCE: ${{ steps.stub.outputs.review_usage_source }}
          REVIEW_DURATION_SECONDS: ${{ steps.stub.outputs.review_duration_seconds }}
          BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
          BASE_REF: ${{ steps.resolve.outputs.base_ref }}
          BASE_REPO: ${{ steps.resolve.outputs.base_repo }}
          HEAD_REF: ${{ steps.resolve.outputs.head_ref }}
          HEAD_REPO: ${{ steps.resolve.outputs.head_repo }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          RISK_MODE: ${{ steps.resolve.outputs.risk_mode }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          HOST: ${{ steps.stub.outputs.host }}
          WORKSPACE: ${{ steps.stub.outputs.workspace }}
          CHECKED_OUT_SHA: ${{ steps.stub.outputs.checked_out_sha }}
          CHECKED_OUT_BRANCH: ${{ steps.stub.outputs.checked_out_branch }}
          TOOL_PATH: ${{ steps.stub.outputs.tool_path }}
          TOOL_READY: ${{ steps.stub.outputs.tool_ready }}
          TOOL_VERSION: ${{ steps.stub.outputs.tool_version }}
          TOOL_ERROR: ${{ steps.stub.outputs.tool_error }}
          REVIEW_STATUS: ${{ steps.stub.outputs.review_status }}
          REVIEW_PAYLOAD: ${{ steps.stub.outputs.review_payload }}
          REVIEW_COMMENT_BODY: ${{ steps.stub.outputs.review_comment_body }}
        with:
          script: |
            const maxInlineComments = 10;

            function normalizePath(path) {
              return (path || "").replace(/^\.\//, "");
            }

            function parseRightSideLines(patch) {
              const lines = new Set();
              let rightLine = null;

              for (const line of (patch || "").split("\n")) {
                const hunk = line.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
                if (hunk) {
                  rightLine = Number(hunk[1]);
                  continue;
                }

                if (rightLine === null) {
                  continue;
                }

                if (line.startsWith("\\")) {
                  continue;
                }

                if (line.startsWith("+") && !line.startsWith("+++")) {
                  lines.add(rightLine);
                  rightLine += 1;
                } else if (line.startsWith("-") && !line.startsWith("---")) {
                  continue;
                } else {
                  lines.add(rightLine);
                  rightLine += 1;
                }
              }

              return lines;
            }

            function nearestLineNumber(lines, target) {
              if (!Array.isArray(lines) || lines.length === 0) {
                return null;
              }

              let nearest = lines[0];
              let nearestDistance = Math.abs(nearest - target);
              for (const line of lines.slice(1)) {
                const distance = Math.abs(line - target);
                if (distance < nearestDistance) {
                  nearest = line;
                  nearestDistance = distance;
                }
              }

              return nearest;
            }

            function parseReviewPayload(payload) {
              if (!(payload || "").trim()) {
                return { findings: [] };
              }

              try {
                return JSON.parse(payload);
              } catch {
                return { findings: [] };
              }
            }

            function formatSummaryFindings(findings) {
              if (!Array.isArray(findings) || findings.length === 0) {
                return [];
              }

              return findings.slice(0, 10).flatMap((finding, index) => {
                const severity = (finding.severity || "unknown").toUpperCase();
                const confidence = (finding.confidence || "unknown").toUpperCase();
                const title = finding.title || "Untitled finding";
                const hasLine = Number.isInteger(Number(finding.line));
                const location = finding.file
                  ? hasLine
                    ? ` \`${finding.file}:${finding.line}\``
                    : ` \`${finding.file}\``
                  : "";
                const body = finding.body || "_No detail provided._";

                return [
                  `${index + 1}. [${severity}/${confidence}] ${title}${location}`,
                  body,
                  "",
                ];
              });
            }

            const review = parseReviewPayload(process.env.REVIEW_PAYLOAD);
            const findings = Array.isArray(review.findings) ? review.findings : [];
            const reviewFailed = process.env.REVIEW_STATUS !== "success";
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
              per_page: 100,
            });
            const diffLinesByPath = new Map(
              files.map((file) => [
                normalizePath(file.filename),
                Array.from(parseRightSideLines(file.patch || "")).sort((a, b) => a - b),
              ])
            );
            const inlineComments = [];
            const summaryFindings = [];

            for (const finding of findings) {
              const path = normalizePath(finding.file);
              const line = Number(finding.line);

              if (
                process.env.RISK_MODE !== "risk-summary" &&
                inlineComments.length < maxInlineComments &&
                path &&
                Number.isInteger(line)
              ) {
                const diffLines = diffLinesByPath.get(path);
                const matchedLine = nearestLineNumber(diffLines, line);
                if (matchedLine !== null) {
                  const severity = (finding.severity || "unknown").toUpperCase();
                  const confidence = (finding.confidence || "unknown").toUpperCase();
                  const title = finding.title || "AI review finding";
                  const body = finding.body || "Review this changed line.";
                  const mappedLineNote =
                    matchedLine !== line
                      ? `\n\nMapped from suggested line ${line} to the nearest line ${matchedLine} in this file's diff.`
                      : "";
                  inlineComments.push({
                    path,
                    line: matchedLine,
                    side: "RIGHT",
                    body: `[${severity}/${confidence}] ${title}\n\n${body}${mappedLineNote}`,
                  });
                  continue;
                }
              }

              summaryFindings.push(finding);
            }

            const summaryLines = Array.isArray(review.summary) && review.summary.length > 0
              ? review.summary.slice(0, 8).map((line) => `- ${line}`)
              : ["_No summary produced._"];
            const checkLines = Array.isArray(review.checks) && review.checks.length > 0
              ? review.checks.slice(0, 8).map((check) => {
                  const name = check.name || "Unnamed check";
                  const status = (check.status || "unknown").toUpperCase();
                  const detail = check.detail ? ` - ${check.detail}` : "";
                  return `- [${status}] ${name}${detail}`;
                })
              : ["_No checks reported._"];
            const handoffLines = Array.isArray(review.handoff_notes) && review.handoff_notes.length > 0
              ? review.handoff_notes.slice(0, 6).map((note) => `- ${note}`)
              : ["_No handoff notes._"];
            const summaryFindingLines = formatSummaryFindings(summaryFindings);
            const noFindingsLine = reviewFailed
              ? "AI review failed. No review findings were produced."
              : findings.length === 0
                ? "Review completed successfully. No Findings."
                : null;
            const bodyLines = [
              "AI review command accepted.",
              noFindingsLine,
              "",
              `- PR: #${process.env.PR_NUMBER}`,
              `- Title: ${process.env.PR_TITLE}`,
              process.env.PR_AUTHOR ? `- Author: @${process.env.PR_AUTHOR}` : null,
              process.env.COMMENTER ? `- Requested by: @${process.env.COMMENTER}` : null,
              `- Changed files: ${process.env.CHANGED_FILES}`,
              `- Additions / deletions: ${process.env.ADDITIONS} / ${process.env.DELETIONS}`,
              `- Review mode: ${process.env.RISK_MODE}`,
              `- PR classification: \`${process.env.PR_CLASSIFICATION || "mixed"}\``,
              `- Provider: \`${process.env.PROVIDER}\``,
              `- Model: \`${process.env.REVIEW_MODEL_REPORTED || "unknown"}\` (${process.env.REVIEW_MODEL_SOURCE || "not reported"})`,
              `- Usage: input \`${process.env.REVIEW_INPUT_TOKENS || "unknown"}\`, output \`${process.env.REVIEW_OUTPUT_TOKENS || "unknown"}\`, cost \`${process.env.REVIEW_COST_USD || "unknown"}\` (${process.env.REVIEW_USAGE_SOURCE || "not reported"})`,
              `- Runtime: \`${process.env.REVIEW_DURATION_SECONDS || "unknown"}s\``,
              `- Base: \`${process.env.BASE_REPO || "unknown"}\` @ \`${process.env.BASE_REF || "unknown"}\``,
              `- Base SHA: \`${process.env.BASE_SHA || "unknown"}\``,
              `- Head: \`${process.env.HEAD_REPO || "unknown"}\` @ \`${process.env.HEAD_REF || "unknown"}\``,
              `- Head SHA: \`${process.env.HEAD_SHA}\``,
              `- Runner: \`${process.env.RUNNER_NAME}\` (${process.env.RUNNER_OS})`,
              `- Host: \`${process.env.HOST}\``,
              `- Workspace: \`${process.env.WORKSPACE}\``,
              `- Checked out SHA: \`${process.env.CHECKED_OUT_SHA}\``,
              `- Checked out branch: \`${process.env.CHECKED_OUT_BRANCH}\``,
              `- CLI path: \`${process.env.TOOL_PATH || "not found"}\``,
              `- CLI ready: ${process.env.TOOL_READY}`,
              process.env.TOOL_READY === "yes"
                ? `- CLI version: \`${process.env.TOOL_VERSION}\``
                : `- CLI error: \`${process.env.TOOL_ERROR || "unknown"}\``,
              `- Inline comments posted: ${inlineComments.length}`,
              `- Summary findings: ${summaryFindings.length}`,
              inlineComments.length >= maxInlineComments && summaryFindings.length > 0
                ? `- Inline comment cap reached: ${maxInlineComments}`
                : null,
              "",
              "### AI Summary",
              ...summaryLines,
              "",
              "### Checks",
              ...checkLines,
              summaryFindingLines.length > 0 ? "" : null,
              summaryFindingLines.length > 0 ? "### Findings" : null,
              ...summaryFindingLines,
              "",
              "### Reviewer Notes",
              ...handoffLines,
            ].filter((line) => line !== null);
            const body = bodyLines.join("\n");

            if (inlineComments.length > 0) {
              try {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: Number(process.env.PR_NUMBER),
                  commit_id: process.env.HEAD_SHA,
                  event: "COMMENT",
                  body,
                  comments: inlineComments,
                });
                return;
              } catch (error) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: Number(process.env.PR_NUMBER),
                  body: [
                    body,
                    "",
                    `Inline review creation failed: ${error.message}`,
                  ].join("\n"),
                });
                return;
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            });

      - name: Upload AI review artifacts
        continue-on-error: true
        if: ${{ always() && steps.resolve.outputs.eligible == 'yes' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ai-review-${{ steps.resolve.outputs.pr_number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ai-review-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove AI review scratch directory
        if: ${{ always() && steps.resolve.outputs.eligible == 'yes' }}
        env:
          AI_REVIEW_SCRATCH_DIR: ${{ runner.temp }}/ai-review-work-${{ github.run_id }}
        run: |
          if [[ "${AI_REVIEW_SCRATCH_DIR}" != "${RUNNER_TEMP}"/ai-review-work-* ]]; then
            echo "Refusing unsafe AI review scratch path: ${AI_REVIEW_SCRATCH_DIR}" >&2
            exit 1
          fi
          if [[ -e "${AI_REVIEW_SCRATCH_DIR}" && ! -O "${AI_REVIEW_SCRATCH_DIR}" ]]; then
            echo "AI review scratch path is not owned by the runner user: ${AI_REVIEW_SCRATCH_DIR}" >&2
            exit 1
          fi
          rm -rf -- "${AI_REVIEW_SCRATCH_DIR}"

      - name: Fail AI review when provider failed
        if: ${{ steps.resolve.outputs.eligible == 'yes' && steps.stub.outputs.review_status != 'success' }}
        run: |
          echo "AI review provider failed: ${{ steps.stub.outputs.tool_error || 'review output was missing or invalid' }}" >&2
          exit 1

      - name: Notify Slack on failure
        if: ${{ failure() && steps.resolve.outputs.eligible == 'yes' }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          PR_TITLE: ${{ steps.resolve.outputs.pr_title }}
          PROVIDER: ${{ steps.resolve.outputs.provider }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const token = process.env.SLACK_BOT_TOKEN;
            const channel = process.env.SLACK_CHANNEL_ID;

            if (!token || !channel) {
              core.warning("Slack notification skipped because Slack secrets are not configured.");
              return;
            }

            const payload = {
              channel,
              text: [
                `AI review workflow failed for ${context.repo.owner}/${context.repo.repo}#${process.env.PR_NUMBER}`,
                `Title: ${process.env.PR_TITLE || "unknown"}`,
                `Provider: ${process.env.PROVIDER || "unknown"}`,
                `Run: ${process.env.WORKFLOW_URL}`,
              ].join("\n"),
            };

            const response = await fetch("https://slack.com/api/chat.postMessage", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json; charset=utf-8",
              },
              body: JSON.stringify(payload),
            });

            const data = await response.json().catch(() => ({}));
            if (!response.ok || !data.ok) {
              throw new Error(`Slack post failed: ${data.error || response.statusText}`);
            }
